# Offline deployment compose file. It never builds or pulls images on the server.
# Run it from inside the uploaded release directory.
services:
  ruoyi-frontend:
    image: nsh-frontend:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in prod.env}
    container_name: ruoyi-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-12580}:80"
    depends_on:
      - ruoyi-backend-my
    networks:
      - ruoyi-network

  ruoyi-backend-my:
    image: nsh-backend-my:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in prod.env}
    container_name: ruoyi-backend-my
    restart: unless-stopped
    env_file:
      - ./prod.env
    environment:
      APP_ROOT_PATH: /docker-api
      APP_HOST: 0.0.0.0
      APP_PORT: 9099
      APP_RELOAD: "false"
      APP_DISABLE_SWAGGER: "true"
      APP_DISABLE_REDOC: "true"
      DB_TYPE: mysql
      DB_HOST: ruoyi-mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in prod.env}
      DB_DATABASE: ${MYSQL_DATABASE:-ruoyi-fastapi}
      DB_ECHO: "false"
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in prod.env}
    volumes:
      - ruoyi-backend-logs:/app/logs
      - ruoyi-backend-vf-admin:/app/vf_admin
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  ruoyi-mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    restart: unless-stopped
    env_file:
      - ./prod.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in prod.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-fastapi}
    volumes:
      - ruoyi-mysql-data:/var/lib/mysql
      - ./sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - ruoyi-network

  ruoyi-redis:
    image: redis:7
    container_name: ruoyi-redis
    restart: unless-stopped
    env_file:
      - ./prod.env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in prod.env}"]
    volumes:
      - ruoyi-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - ruoyi-network

networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge

volumes:
  ruoyi-mysql-data:
    name: nsh-mysql-data
  ruoyi-redis-data:
    name: nsh-redis-data
  ruoyi-backend-logs:
    name: nsh-backend-logs
  ruoyi-backend-vf-admin:
    name: nsh-backend-vf-admin
