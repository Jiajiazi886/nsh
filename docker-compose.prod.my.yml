services:
  ruoyi-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
    image: ruoyi-frontend:prod
    container_name: ruoyi-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-12580}:80"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ruoyi-backend-my
    networks:
      - ruoyi-network

  ruoyi-backend-my:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.my
    image: ruoyi-backend-my:prod
    container_name: ruoyi-backend-my
    restart: unless-stopped
    env_file:
      - ${RUOYI_PROD_ENV_FILE:-./deploy/prod.env}
    environment:
      APP_ROOT_PATH: /docker-api
      APP_HOST: 0.0.0.0
      APP_PORT: 9099
      APP_RELOAD: "false"
      APP_DISABLE_SWAGGER: "true"
      APP_DISABLE_REDOC: "true"
      DB_TYPE: mysql
      DB_HOST: ruoyi-mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/prod.env}
      DB_DATABASE: ${MYSQL_DATABASE:-ruoyi-fastapi}
      DB_ECHO: "false"
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/prod.env}
    volumes:
      - ruoyi-backend-logs:/app/logs
      - ruoyi-backend-vf-admin:/app/vf_admin
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  ruoyi-mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    restart: unless-stopped
    env_file:
      - ${RUOYI_PROD_ENV_FILE:-./deploy/prod.env}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/prod.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-fastapi}
    volumes:
      - ruoyi-mysql-data:/var/lib/mysql
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - ruoyi-network

  ruoyi-redis:
    image: redis:7
    container_name: ruoyi-redis
    restart: unless-stopped
    env_file:
      - ${RUOYI_PROD_ENV_FILE:-./deploy/prod.env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/prod.env}"]
    volumes:
      - ruoyi-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - ruoyi-network

networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge

volumes:
  ruoyi-mysql-data:
  ruoyi-redis-data:
  ruoyi-backend-logs:
  ruoyi-backend-vf-admin:
